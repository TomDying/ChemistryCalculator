
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 5px;
    background: #141B2D;
    color: white;
    font-family: Arial, sans-serif;
}

.periodic-scroll {
    width: 100%;
    height: 550px;
    overflow-x: auto;
    overflow-y: auto;
    padding: 10px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

.periodic-scroll::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

.periodic-scroll::-webkit-scrollbar-track {
    background: #1E293B;
    border-radius: 10px;
}

.periodic-scroll::-webkit-scrollbar-thumb {
    background: #475569;
    border-radius: 10px;
}

.periodic-scroll::-webkit-scrollbar-thumb:hover {
    background: #22C55E;
}

.periodic-grid {
    display: grid;
    grid-template-columns: repeat(18, 55px);
    gap: 5px;
    min-width: 1075px;
}

.element {
    height: 68px;
    border: 2px solid;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    position: relative;
    transition: 0.15s;
    user-select: none;
}

.element:hover {
    filter: brightness(1.4);
    transform: scale(1.07);
    z-index: 10;
}

.element.selected {
    border: 3px solid white !important;
    box-shadow: 0 0 12px #22C55E;
    filter: brightness(1.3);
}

.number {
    font-size: 10px;
}

.symbol {
    font-size: 19px;
    font-weight: bold;
}

.name {
    font-size: 8px;
}

.empty {
    width: 55px;
    height: 68px;
}

.section-title {
    color: white;
    font-size: 17px;
    margin-top: 18px;
    margin-bottom: 10px;
}

/* TOOLTIP */

.tooltip {
    position: fixed;
    display: none;
    background: #1E293B;
    color: white;
    border: 1px solid #22C55E;
    border-radius: 9px;
    padding: 12px;
    width: 205px;
    font-size: 12px;
    line-height: 1.7;
    pointer-events: none;
    z-index: 99999;
    box-shadow: 0 5px 20px #0008;
}

.tooltip strong {
    color: #22C55E;
    font-size: 14px;
}

@media (max-width: 600px) {
    .periodic-scroll {
        height: 500px;
    }
}
</style>
</head>

<body>

<div class="periodic-scroll">

    <div class="periodic-grid" id="main-table"></div>

    <div class="section-title">Lanthanides</div>
    <div class="periodic-grid" id="lanthanides"></div>

    <div class="section-title">Actinides</div>
    <div class="periodic-grid" id="actinides"></div>

</div>

<div class="tooltip" id="tooltip"></div>

<script>
let elements = {};
let rows = [];
let lanthanides = [];
let actinides = [];
let selected = null;

function sendMessage(type, data) {
    window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...data
    }, "*");
}

function setFrameHeight() {
    sendMessage("streamlit:setFrameHeight", {
        height: 590
    });
}

function selectElement(symbol) {

    selected = symbol;

    document.querySelectorAll(".element").forEach(el => {
        el.classList.toggle(
            "selected",
            el.dataset.symbol === symbol
        );
    });

    sendMessage("streamlit:setComponentValue", {
        value: symbol
    });
}

function createElement(symbol) {

    if (!symbol) {
        const empty = document.createElement("div");
        empty.className = "empty";
        return empty;
    }

    const data = elements[symbol];

    if (!data) {
        const empty = document.createElement("div");
        empty.className = "empty";
        return empty;
    }

    const cell = document.createElement("div");

    cell.className = "element";
    cell.dataset.symbol = symbol;

    cell.style.background = data.colour + "25";
    cell.style.borderColor = data.colour;

    cell.innerHTML = `
        <span class="number">${data.number}</span>
        <span class="symbol">${symbol}</span>
        <span class="name">${data.name}</span>
    `;

    cell.addEventListener("click", () => {
        selectElement(symbol);
    });

    cell.addEventListener("mouseenter", event => {
        showTooltip(data, event);
    });

    cell.addEventListener("mousemove", event => {
        moveTooltip(event);
    });

    cell.addEventListener("mouseleave", () => {
        hideTooltip();
    });

    return cell;
}

function renderGrid(containerId, symbols) {

    const container = document.getElementById(containerId);

    container.innerHTML = "";

    symbols.forEach(symbol => {
        container.appendChild(createElement(symbol));
    });
}

function renderTable() {

    const main = document.getElementById("main-table");

    main.innerHTML = "";

    rows.forEach(row => {
        row.forEach(symbol => {
            main.appendChild(createElement(symbol));
        });
    });

    renderGrid("lanthanides", lanthanides);
    renderGrid("actinides", actinides);

    if (selected) {
        document.querySelectorAll(".element").forEach(el => {
            el.classList.toggle(
                "selected",
                el.dataset.symbol === selected
            );
        });
    }
}

function showTooltip(data, event) {

    const tooltip = document.getElementById("tooltip");

    tooltip.innerHTML = `
        <strong>${data.name} (${data.symbol})</strong><br>
        Atomic Number: ${data.number}<br>
        Atomic Mass: ${data.mass} g/mol<br>
        Category: ${data.category}<br>
        Density: ${data.density}
    `;

    tooltip.style.display = "block";

    moveTooltip(event);
}

function moveTooltip(event) {

    const tooltip = document.getElementById("tooltip");

    let x = event.clientX + 15;
    let y = event.clientY + 15;

    if (x + 220 > window.innerWidth) {
        x = event.clientX - 220;
    }

    if (y + 160 > window.innerHeight) {
        y = event.clientY - 160;
    }

    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
}

function hideTooltip() {
    document.getElementById("tooltip").style.display = "none";
}

/* STREAMLIT COMPONENT PROTOCOL */

function onRender(event) {

    const args = event.data.args;

    if (!args || !args.data) return;

    elements = args.data.elements;
    rows = args.data.rows;
    lanthanides = args.data.lanthanides;
    actinides = args.data.actinides;

    if (args.selected !== undefined) {
        selected = args.selected;
    }

    renderTable();

    setFrameHeight();
}

window.addEventListener("message", event => {

    if (
        event.data &&
        event.data.type === "streamlit:render"
    ) {
        onRender(event);
    }

});

sendMessage("streamlit:componentReady", {
    apiVersion: 1
});

setFrameHeight();

</script>

</body>
</html>
